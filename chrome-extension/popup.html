<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      color: #202124;
    }
    h2 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .status-box {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .ok   { background: #e6f4ea; color: #1e7e34; }
    .ok .dot { background: #34a853; }
    .warn { background: #fff8e1; color: #b45309; }
    .warn .dot { background: #fbbc04; }
    .err  { background: #fce8e6; color: #c62828; }
    .err .dot { background: #ea4335; }
    .info { background: #e8f0fe; color: #1a73e8; }
    .info .dot { background: #1a73e8; }
    .since { font-size: 11px; color: #666; margin-top: 4px; }
    a { color: inherit; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #9aa0a6; cursor: default; }
  </style>
</head>
<body>
  <h2><span id="dot" class="dot"></span> Jira Token Relay</h2>
  <div id="status-box" class="status-box info">Checking...</div>
  <button id="btn-sync">Sync Now</button>
  <script src="popup.js"></script>
</body>
</html>
